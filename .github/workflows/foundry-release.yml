name: Foundry system release

# Push a tag like v0.1.0 to publish a release with system.json and system.zip.
# The system lives in foundry/; the website at the repo root is unaffected.
# MIGRATION RELEASE. The Cantica system now lives in its own repository,
#   https://github.com/craigmaddux/canticafoundry
# This release is built here one last time so existing installs can update across: the zip is downloaded from this
# repository, but the system.json inside it points manifest at the new repository, so every update after this one
# comes from there. Nothing else is published from this repository any more.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: foundry
    steps:
      - uses: actions/checkout@v4

      - name: Run rules tests
        run: node --test test/*.test.mjs

      - name: Stamp version and URLs into system.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${GITHUB_REPOSITORY}"
          jq --arg v "$VERSION" \
             --arg url "https://github.com/craigmaddux/canticafoundry" \
             --arg manifest "https://github.com/craigmaddux/canticafoundry/releases/latest/download/system.json" \
             --arg download "https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}/system.zip" \
             '.version = $v | .url = $url | .manifest = $manifest | .download = $download' \
             system.json > system.tmp && mv system.tmp system.json

      - name: Bundle the lore (ledger entries and their art)
        working-directory: .
        run: node foundry/scripts/bundle-lore.mjs

      - name: Build system.zip
        run: zip -r system.zip system.json cantica.mjs module templates styles lang assets samples lore

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            foundry/system.json
            foundry/system.zip
          generate_release_notes: true
